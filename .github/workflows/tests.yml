name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Qt потребує цих системних бібліотек навіть у режимі без екрана
      - name: Системні бібліотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Тести (вікно не показується)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Системні бібліотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Порог 90%: нижче нього легше впасти, ніж пройти повз непокриту гілку.
      - name: Покриття
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=90 | tee coverage.txt
          {
            echo '### Покриття тестами'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  build-exe:
    # Збірка .exe потрібна лише на push: у pull request вона б тільки
    # витрачала хвилини й нічого не перевіряла.
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      # Консоль Windows-ранера — cp1252, а тренажер друкує українською:
      # без цього збірка й .exe падають з UnicodeEncodeError.
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Залежності для збірки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Зібрати PyTrainer.exe
        run: python tools/build_exe.py

      - name: Перевірити, що .exe справді запускається
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # .exe зібрано як віконну програму (без консолі), тому PowerShell
          # її не чекає: прямий виклик повертається одразу, а знімок
          # з'являється за секунди. Чекаємо саме завершення процесу.
          $p = Start-Process -FilePath ".\dist\PyTrainer.exe" -ArgumentList "--demo","--screenshot","smoke.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw ".exe завершився з кодом $($p.ExitCode)" }
          if (-not (Test-Path smoke.png)) { throw "Застосунок не зробив знімок — .exe не працює" }
          Get-Item dist\PyTrainer.exe | Select-Object Name, @{n="МБ";e={[math]::Round($_.Length/1MB,1)}}

      # Вікно відкривається навіть тоді, коли запуск коду в зібраному .exe
      # зламаний (так і було: sys.executable у .exe — це сам тренажер).
      # Тому перевіряємо не вікно, а вердикт: .exe сам виконує код,
      # зламаний код і while True — і пише, чи все зійшлось.
      - name: Перевірити, що .exe виконує код і перевірки
        run: |
          # Та сама причина, що й вище: віконний .exe не блокує shell,
          # тому чекаємо завершення процесу, а не лише появи файлу.
          $p = Start-Process -FilePath ".\dist\PyTrainer.exe" -ArgumentList "--self-test","selftest.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw ".exe self-test завершився з кодом $($p.ExitCode)" }
          Get-Content selftest.json
          $report = Get-Content selftest.json -Raw | ConvertFrom-Json
          if (-not $report.ok) {
            $failed = ($report.steps | Where-Object { -not $_.ok } | ForEach-Object { $_.name + ': ' + $_.detail }) -join '; '
            throw "Запуск коду в .exe не працює. Невдалі кроки: $failed"
          }

      - name: Архів для завантаження
        run: Compress-Archive -Path dist\* -DestinationPath PyTrainer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PyTrainer-windows
          path: |
            PyTrainer-windows.zip
            dist/PyTrainer.exe

  release:
    # Тег v1.0.0 → готовий .exe у релізі, щоб людині не треба було
    # мати Python узагалі.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unittest, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PyTrainer-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: PyTrainer-windows.zip
          generate_release_notes: true
          body: |
            Windows: завантаж `PyTrainer-windows.zip`, розпакуй і запусти
            `PyTrainer.exe`. Прогрес ляже в `%LOCALAPPDATA%\PyTrainer`
            (меню «Файл → Відкрити теку з даними»), а `progress.json` і
            `Python-Roadmap.md` — поруч із .exe. Хочеш усе в одній теці —
            запускай із прапорцем `--data-dir ТЕКА` (портативний режим).
