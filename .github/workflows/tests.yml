name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt потребує цих системних бібліотек навіть у режимі без екрана
      - name: Системні бібліотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Залежності
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Тести (усі 115, вікно не показується)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
