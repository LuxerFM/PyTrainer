[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrainer"
version = "0.2.0"
description = "Десктопний тренажер Python: перевіряє твій код, дає підказки за таймером і повертає задачі на повторення"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LuxerFM" }]
keywords = [
    "python",
    "learning",
    "education",
    "pyside6",
    "qt",
    "trainer",
    "spaced-repetition",
    "ukrainian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Ukrainian",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = ["PySide6>=6.10"]

[project.scripts]
pytrainer = "trainer.app:main"

[project.urls]
Homepage = "https://github.com/LuxerFM/pytrainer"
Source = "https://github.com/LuxerFM/pytrainer"

[tool.setuptools]
packages = ["curriculum", "trainer", "trainer.core", "trainer.ui"]
py-modules = ["main"]

# Покриття: міряємо лише сам застосунок (не tools/ і не тести), інакше цифра
# нічого не означає — допоміжні скрипти перевіряються очима, а не тестами.
# Правки в цьому розділі однакові для локального запуску й для CI, тому
# `coverage run -m unittest discover -s tests` працює без додаткових прапорців.
[tool.coverage.run]
source = ["curriculum", "trainer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
show_missing = true
